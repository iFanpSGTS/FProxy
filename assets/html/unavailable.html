<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Unavailable</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(135deg, #f7e7ce 0%, #e6b07a 100%);
            color: #3b2c1a;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: rgba(255,255,255,0.85);
            border: 4px solid #b97a56;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(60, 40, 20, 0.18);
            padding: 40px 30px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #b97a56;
            font-family: 'Impact', 'Arial Black', Arial, sans-serif;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #fff2d6, 4px 4px 0 #b97a56;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #5e4632;
        }
        .error-code {
            font-size: 20px;
            color: #a67c52;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 1px;
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #8c6e54;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Website Unavailable</h1>
        <p>
           We are currently unable to connect to the server for this website.
        </p>
        <div class="error-code">Error code: 503 - Service Unavailable</div>
        <div class="footer">Powered by FProxy</div>
    </div>
</body>
</html>
